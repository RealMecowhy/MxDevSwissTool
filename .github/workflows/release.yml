name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a GitHub Release
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare Release Package
        run: |
          mkdir -p release_package
          # Copy only the files needed for the end user
          cp -r public release_package/
          cp -r server release_package/
          # Both scripts are required by the npm prestart hook (zero-dependency).
          # Shipping only one of them made the documented `npm start` fallback
          # die with MODULE_NOT_FOUND — the .bat launcher calls node directly and
          # never hit it, so it went unnoticed from v1.32.0 to v1.39.0.
          mkdir -p release_package/scripts
          cp scripts/sync-app-version.js release_package/scripts/
          cp scripts/sync-sw-version.js release_package/scripts/
          cp package.json release_package/
          cp package-lock.json release_package/
          cp Start-MxDevSwissTool.bat release_package/
          cp README.md release_package/
          cp CHANGELOG.md release_package/
          
      - name: Create ZIP Archive
        working-directory: release_package
        run: zip -r ../MxDevSwissTool-Release-${{ github.ref_name }}.zip ./*

      - name: Sign the release package
        env:
          SIGNING_KEY: ${{ secrets.MXDEV_RELEASE_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::MXDEV_RELEASE_PRIVATE_KEY is not set — publishing an UNSIGNED release."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" > /tmp/release_key.pem
          node -e '
            const fs=require("fs"),crypto=require("crypto");
            const zip="MxDevSwissTool-Release-${{ github.ref_name }}.zip";
            const key=crypto.createPrivateKey(fs.readFileSync("/tmp/release_key.pem"));
            const sig=crypto.sign(null, fs.readFileSync(zip), key);
            fs.writeFileSync(zip+".sig", sig.toString("base64"));
          '
          rm -f /tmp/release_key.pem

      - name: Publish GitHub Release
        # v1 declared node20 and was being force-run on node24 by the runner.
        # Every input used below still exists in v3, and `token` keeps defaulting
        # to github.token, so the `permissions: contents: write` above is still
        # what authorises the publish — no secret needs adding.
        uses: softprops/action-gh-release@v3
        with:
          files: |
            MxDevSwissTool-Release-${{ github.ref_name }}.zip
            MxDevSwissTool-Release-${{ github.ref_name }}.zip.sig
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
